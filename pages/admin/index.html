<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Portal — FeedNow</title>
  <script src="../../assets/js/shared/guards.js"></script>
  <script>
    const { token, user } = Guards.getAuthStatus();
    if (token && user && user.role === 'admin') {
      window.location.replace('dashboard.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</head>
<body>
  <p>Loading Admin Portal...</p>
</body>
</html>
