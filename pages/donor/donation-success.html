<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Successful — FeedNow</title>
  <meta name="description" content="Your donation request has been sent.">
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="auth-layout" style="background: var(--background);">
    <div class="auth-card" style="text-align: center; max-width: 480px;">
      
      <div style="width: 80px; height: 80px; background: var(--success-bg); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto var(--space-6); animation: scaleIn 0.5s var(--ease-bounce);">
        <i class="ph ph-check"></i>
      </div>

      <h1 class="text-2xl font-bold margin-bottom-2">Request Sent Successfully!</h1>
      <p class="text-secondary line-height-relaxed margin-bottom-8">
        Thank you for your generosity. Your donation request for <strong>50 Meals</strong> has been sent to <strong>Hope Foundation</strong>. You will be notified once they accept it.
      </p>

      <div style="display: flex; flex-direction: column; gap: var(--space-3);">
        <a href="donation-details.html?id=1" class="btn btn--primary btn--lg btn--full">Track Donation Status</a>
        <a href="dashboard.html" class="btn btn--ghost btn--lg btn--full">Back to Dashboard</a>
      </div>

    </div>
  </div>

</body>
</html>
