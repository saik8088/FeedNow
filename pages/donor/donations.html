<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Donations — FeedNow</title>
  <meta name="description" content="View your donation history.">
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <style>
    .donations-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }
    .donations-table th {
      text-align: left;
      padding: var(--space-4);
      font-size: var(--text-xs);
      font-weight: var(--weight-semibold);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--border-light);
      background: var(--gray-50);
    }
    .donations-table td {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-light);
      vertical-align: middle;
      font-size: var(--text-sm);
    }
    .donations-table tr:hover td {
      background: var(--primary-50);
    }
    
    .table-food-info {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .table-food-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: #fff;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--text-lg);
    }
    .table-food-details {
      display: flex;
      flex-direction: column;
    }
    .table-food-title {
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
    }
    
    @media (max-width: 768px) {
      .donations-table thead {
        display: none;
      }
      .donations-table tr {
        display: block;
        padding: var(--space-4);
        border: 1px solid var(--border-light);
        border-radius: var(--radius-lg);
        margin-bottom: var(--space-4);
        background: var(--surface);
      }
      .donations-table td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--space-2) 0;
        border: none;
      }
      .donations-table td::before {
        content: attr(data-label);
        font-size: var(--text-xs);
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .donations-table td.full-width {
        flex-direction: column;
        align-items: flex-start;
      }
      .donations-table td.full-width::before {
        display: none;
      }
      .donations-table tr:hover td {
        background: transparent;
      }
    }
  </style>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="dashboard-layout">
    
    <button class="sidebar__mobile-toggle" aria-label="Toggle Menu">☰</button>
    <div class="sidebar__overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <a href="../../index.html" class="sidebar__logo">
          <img src="../../favicon.png" alt="FeedNow">
          <span class="sidebar__logo-text">Feed<span>Now</span></span>
        </a>
      </div>
      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Donor Menu</div>
        <a href="dashboard.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-chart-bar"></i></span> Dashboard</a>
        <a href="nearby-ngos.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-map-pin"></i></span> Find NGOs</a>
        <a href="donations.html" class="sidebar__link active"><span class="sidebar__link-icon"><i class="ph ph-package"></i></span> My Donations</a>
        <a href="notifications.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-bell"></i></span> Notifications</a>
        <a href="profile.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-user"></i></span> Profile</a>
      </nav>
    
      <div class="sidebar__footer">
        <a href="../../index.html" class="sidebar__footer-link">
          <span class="sidebar__link-icon"><i class="ph ph-house"></i></span> Back to Home
        </a>
        <a href="#" class="sidebar__footer-link sidebar__footer-link--danger" onclick="logout()">
          <span class="sidebar__link-icon"><i class="ph ph-sign-out"></i></span> Logout
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
      <header class="dashboard-main__header">
        <div>
          <h1 class="dashboard-main__title">My Donations</h1>
          <p class="dashboard-main__subtitle">Track your past and current food donations.</p>
        </div>
        <a href="nearby-ngos.html" class="btn btn--primary">Donate Food</a>
      </header>

      <div class="dashboard-main__content">
        
        <div class="tabs animate-fade-in-up" id="donationTabs">
          <div class="tab active" data-filter="all">All</div>
          <div class="tab" data-filter="active">Active <span class="tab__count" id="activeCount">0</span></div>
          <div class="tab" data-filter="completed">Completed</div>
          <div class="tab" data-filter="declined">Declined</div>
        </div>

        <div class="card card--flat animate-fade-in-up delay-1" style="padding: 0; overflow: hidden;">
          <table class="donations-table">
            <thead>
              <tr>
                <th>Donation Details</th>
                <th>NGO</th>
                <th>Quantity</th>
                <th>Date</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="donationsTbody">
              <tr>
                <td colspan="6" style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
                  <span class="spinner"></span> Loading donations...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/zoom-fix.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/shared/guards.js"></script>
  <script src="../../assets/js/navigation.js"></script>
  <script>
    let allDonations = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!Guards.requireRole('donor')) return;

      const tbody = document.getElementById('donationsTbody');

      try {
        const res = await API.donations.getMy();
        allDonations = res && res.donations ? res.donations : [];

        // Count active
        const activeCount = allDonations.filter(d => ['PENDING', 'ACCEPTED', 'COORDINATED'].includes(d.status)).length;
        document.getElementById('activeCount').textContent = activeCount;

        renderTable(allDonations);
        setupTabs();
      } catch (err) {
        console.error('Failed to load donations:', err);
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger); padding: var(--space-6);">Failed to load donations: ${err.message}</td></tr>`;
      }
    });

    function renderTable(donations) {
      const tbody = document.getElementById('donationsTbody');
      if (donations.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; padding: var(--space-8); color: var(--text-muted);">
              No donations found in this category.
            </td>
          </tr>
        `;
        return;
      }

      const statusMap = {
        PENDING: '<span class="badge badge--pending">Pending Review</span>',
        ACCEPTED: '<span class="badge badge--pickup">Accepted</span>',
        COORDINATED: '<span class="badge badge--pickup">Pickup Scheduled</span>',
        COMPLETED: '<span class="badge badge--completed">Completed</span>',
        DECLINED: '<span class="badge" style="background:#fee2e2;color:#991b1b;">Declined</span>',
      };

      tbody.innerHTML = donations.map(d => {
        const dateStr = d.createdAt ? new Date(d.createdAt).toLocaleString() : '';
        const badge = statusMap[d.status] || `<span class="badge">${d.status}</span>`;
        const ngoName = d.ngoName || d.ngoId?.name || 'NGO';

        return `
          <tr style="cursor: pointer;" onclick="window.location.href='donation-details.html?id=${d._id}'">
            <td data-label="Donation Details" class="full-width">
              <div class="table-food-info">
                <div class="table-food-icon"><i class="ph ph-bowl-food"></i></div>
                <div class="table-food-details">
                  <span class="table-food-title">${d.foodName}</span>
                  <span class="text-xs text-muted">${d.foodType}</span>
                </div>
              </div>
            </td>
            <td data-label="NGO">${ngoName}</td>
            <td data-label="Quantity">${d.quantity}</td>
            <td data-label="Date">${dateStr}</td>
            <td data-label="Status">${badge}</td>
            <td data-label="Action"><a href="donation-details.html?id=${d._id}" class="btn btn--ghost btn--sm">View</a></td>
          </tr>
        `;
      }).join('');
    }

    function setupTabs() {
      const tabs = document.querySelectorAll('#donationTabs .tab');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          const filter = tab.getAttribute('data-filter');

          if (filter === 'all') {
            renderTable(allDonations);
          } else if (filter === 'active') {
            renderTable(allDonations.filter(d => ['PENDING', 'ACCEPTED', 'COORDINATED'].includes(d.status)));
          } else if (filter === 'completed') {
            renderTable(allDonations.filter(d => d.status === 'COMPLETED'));
          } else if (filter === 'declined') {
            renderTable(allDonations.filter(d => d.status === 'DECLINED'));
          }
        });
      });
    }

    function logout() {
      API.auth.logout();
    }
  </script>
</body>
</html>
