<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Donation — FeedNow</title>
  <meta name="description" content="Send a food donation request.">
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="dashboard-layout">
    
    <button class="sidebar__mobile-toggle" aria-label="Toggle Menu">☰</button>
    <div class="sidebar__overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <a href="../../index.html" class="sidebar__logo">
          <img src="../../favicon.png" alt="FeedNow">
          <span class="sidebar__logo-text">Feed<span>Now</span></span>
        </a>
      </div>
      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Donor Menu</div>
        <a href="dashboard.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-chart-bar"></i></span> Dashboard</a>
        <a href="nearby-ngos.html" class="sidebar__link active"><span class="sidebar__link-icon"><i class="ph ph-map-pin"></i></span> Find NGOs</a>
        <a href="donations.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-package"></i></span> My Donations</a>
      </nav>
      <div class="sidebar__footer">
        <a href="../../index.html" class="sidebar__footer-link"><span class="sidebar__link-icon"><i class="ph ph-house"></i></span> Back to Home</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
      <header class="dashboard-main__header">
        <div style="display: flex; align-items: center; gap: var(--space-4);">
          <a href="ngo-details.html?id=1" class="btn btn--icon btn--ghost" style="font-size: 1.2rem;">←</a>
          <div>
            <h1 class="dashboard-main__title">Create Donation Request</h1>
          </div>
        </div>
      </header>

      <div class="dashboard-main__content">
        <div class="content-grid" style="max-width: 680px; margin: 0 auto;">
          
          <!-- Selected NGO Context -->
          <div class="card animate-fade-in-up">
            <p class="text-xs text-muted text-uppercase" style="margin-bottom: var(--space-2); letter-spacing: 0.05em;">Donating to</p>
            <div style="display: flex; align-items: center; gap: var(--space-4);">
              <div class="avatar avatar--lg"><i class="ph ph-buildings"></i></div>
              <div>
                <h3 class="text-lg font-semibold" id="ngoNameHeader">Select an NGO</h3>
                <p class="text-sm text-secondary" id="ngoMetaHeader"><i class="ph ph-map-pin"></i> Loading organization details...</p>
              </div>
            </div>
          </div>

          <!-- Donation Form -->
          <div class="card animate-fade-in-up delay-1">
            <form onsubmit="return false;" id="donationForm">
              
              <div class="form-group">
                <label class="form-label" for="foodName">What food are you donating? <span class="required">*</span></label>
                <input type="text" id="foodName" class="form-input" placeholder="e.g., Vegetable Curry & Rice" required>
              </div>

              <div class="form-group">
                <label class="form-label">Food Type <span class="required">*</span></label>
                <div class="form-radio-group">
                  <label class="form-radio">
                    <input type="radio" name="foodType" value="Vegetarian" required>
                    <span class="form-radio__label">Vegetarian</span>
                  </label>
                  <label class="form-radio">
                    <input type="radio" name="foodType" value="Non-Vegetarian">
                    <span class="form-radio__label">Non-Vegetarian</span>
                  </label>
                  <label class="form-radio">
                    <input type="radio" name="foodType" value="Vegan">
                    <span class="form-radio__label">Vegan</span>
                  </label>
                </div>
              </div>

              <div class="grid-2-col">
                <div class="form-group">
                  <label class="form-label" for="quantity">Quantity <span class="required">*</span></label>
                  <input type="number" id="quantity" class="form-input" placeholder="e.g., 50" required min="1">
                </div>
                <div class="form-group">
                  <label class="form-label" for="unit">Unit <span class="required">*</span></label>
                  <select id="unit" class="form-select" required>
                    <option value="" disabled selected>Select Unit</option>
                    <option value="Meals">Meals</option>
                    <option value="Plates">Plates</option>
                    <option value="Packs">Packs</option>
                    <option value="Kilograms">Kilograms</option>
                  </select>
                </div>
              </div>

              <div class="grid-2-col">
                <div class="form-group">
                  <label class="form-label" for="preparedTime">When was it prepared? <span class="required">*</span></label>
                  <input type="datetime-local" id="preparedTime" class="form-input" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="availableUntil">Available until (Pickup deadline) <span class="required">*</span></label>
                  <input type="time" id="availableUntil" class="form-input" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="pickupAddress">Pickup Address <span class="required">*</span></label>
                <textarea id="pickupAddress" class="form-textarea" placeholder="Enter complete address for pickup" style="min-height: 80px;" required>Koramangala, Bengaluru</textarea>
              </div>

              <div class="form-group">
                <label class="form-label" for="notes">Additional Notes (Optional)</label>
                <textarea id="notes" class="form-textarea" placeholder="e.g., Needs to be refrigerated, handle with care..." style="min-height: 80px;"></textarea>
              </div>

              <hr class="divider">

              <div style="display: flex; justify-content: flex-end; gap: var(--space-4);">
                <a href="nearby-ngos.html" id="cancelBtn" class="btn btn--ghost">Cancel</a>
                <button type="button" class="btn btn--primary" id="submitBtn" onclick="submitDonation()">Review & Send Request</button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/zoom-fix.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/shared/guards.js"></script>
  <script src="../../assets/js/shared/ui.js"></script>
  <script src="../../assets/js/navigation.js"></script>
  <script>
    let currentNgoId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      if (!Guards.requireRole('donor')) return;

      // Set default prepared time to now
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('preparedTime').value = now.toISOString().slice(0, 16);

      // Set default available until to 4 hours from now
      const deadline = new Date(Date.now() + 4 * 3600 * 1000);
      const hours = String(deadline.getHours()).padStart(2, '0');
      const minutes = String(deadline.getMinutes()).padStart(2, '0');
      document.getElementById('availableUntil').value = `${hours}:${minutes}`;

      const params = new URLSearchParams(window.location.search);
      currentNgoId = params.get('ngo');

      if (currentNgoId) {
        document.getElementById('cancelBtn').href = `ngo-details.html?id=${currentNgoId}`;
        try {
          const res = await API.ngos.getById(currentNgoId);
          if (res.success && res.profile) {
            const p = res.profile;
            document.getElementById('ngoNameHeader').textContent = p.organizationName || 'NGO';
            document.getElementById('ngoMetaHeader').innerHTML = `<i class="ph ph-map-pin"></i> ${p.city || 'Bengaluru'} • Accepts: ${(p.foodTypes || ['Vegetarian']).join(', ')}`;
            // If the profile has userId ObjectId, store it
            if (p.userId?._id) currentNgoId = p.userId._id;
            else if (p.userId) currentNgoId = p.userId;
          }
        } catch (err) {
          console.error('Failed to load NGO info:', err);
        }
      } else {
        // Fetch first available NGO
        try {
          const res = await API.ngos.getAll();
          if (res.success && res.ngos && res.ngos.length > 0) {
            const first = res.ngos[0];
            currentNgoId = first.userId?._id || first.userId || first._id;
            document.getElementById('ngoNameHeader').textContent = first.organizationName || 'NGO';
            document.getElementById('ngoMetaHeader').innerHTML = `<i class="ph ph-map-pin"></i> ${first.city || 'Bengaluru'} • Accepts: ${(first.foodTypes || ['Vegetarian']).join(', ')}`;
          } else {
            document.getElementById('ngoNameHeader').textContent = 'No NGOs available';
            document.getElementById('ngoMetaHeader').textContent = 'Please register an NGO account first.';
          }
        } catch (err) {
          console.error(err);
        }
      }
    });

    async function submitDonation() {
      const form = document.getElementById('donationForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (!currentNgoId) {
        alert('Please select a valid NGO to donate to.');
        window.location.href = 'nearby-ngos.html';
        return;
      }

      const foodName = document.getElementById('foodName').value.trim();
      const foodTypeEl = document.querySelector('input[name="foodType"]:checked');
      const foodType = foodTypeEl ? foodTypeEl.value : 'Vegetarian';
      const quantity = document.getElementById('quantity').value.trim();
      const unit = document.getElementById('unit').value;
      const preparedTime = document.getElementById('preparedTime').value;
      const timeVal = document.getElementById('availableUntil').value;
      const pickupAddress = document.getElementById('pickupAddress').value.trim();
      const notes = document.getElementById('notes').value.trim();

      // Compute pickupDeadline Date
      const [h, m] = timeVal.split(':').map(Number);
      const deadlineDate = new Date();
      deadlineDate.setHours(h, m, 0, 0);
      if (deadlineDate <= new Date()) {
        // If the time is earlier today, set for tomorrow
        deadlineDate.setDate(deadlineDate.getDate() + 1);
      }

      const btn = document.getElementById('submitBtn');
      UI.setButtonLoading(btn, true);

      try {
        const res = await API.donations.create({
          ngoId: currentNgoId,
          foodName,
          foodType,
          quantity: `${quantity} ${unit}`,
          preparedAt: preparedTime ? new Date(preparedTime).toISOString() : new Date().toISOString(),
          pickupDeadline: deadlineDate.toISOString(),
          pickupAddress,
          notes,
        });

        if (res.success) {
          window.location.href = 'donation-success.html';
        } else {
          alert(res.message || 'Failed to create donation');
          UI.setButtonLoading(btn, false);
        }
      } catch (err) {
        alert(err.message || 'Failed to submit donation');
        UI.setButtonLoading(btn, false);
      }
    }

    function logout() {
      API.auth.logout();
    }
  </script>
</body>
</html>
