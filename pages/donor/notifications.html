<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — FeedNow</title>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <style>
    .notification-list { 
      display: flex; 
      flex-direction: column; 
      background: #ffffff; 
      border: 1px solid var(--border-light); 
      border-radius: var(--radius-xl); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
      overflow: hidden; 
    }
    .notification-item { 
      padding: var(--space-6); 
      display: flex; 
      gap: var(--space-5); 
      align-items: flex-start; 
      transition: background 0.2s ease; 
      cursor: pointer; 
      border-bottom: 1px solid var(--border-light); 
      background: #ffffff;
    }
    .notification-item:last-child { 
      border-bottom: none; 
    }
    .notification-item:hover { 
      background: var(--gray-50); 
    }
    .notification-item.unread .notification-title::after { 
      content: ''; 
      display: inline-block; 
      width: 8px; 
      height: 8px; 
      border-radius: 50%; 
      background: var(--primary); 
      margin-left: 8px;
      vertical-align: middle;
      transform: translateY(-1px);
    }
    .notification-icon { 
      width: 48px; 
      height: 48px; 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 1.5rem; 
      flex-shrink: 0; 
    }
    .notification-content { 
      flex: 1; 
      display: flex;
      flex-direction: column;
    }
    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .notification-title { 
      font-size: var(--text-base); 
      font-weight: var(--weight-bold); 
      color: var(--text-primary); 
    }
    .notification-time { 
      font-size: var(--text-xs); 
      color: var(--text-muted); 
      font-weight: var(--weight-medium); 
    }
    .notification-desc {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: var(--leading-relaxed);
    }
  </style>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="dashboard-layout">
    <button class="sidebar__mobile-toggle" aria-label="Toggle Menu">☰</button>
    <div class="sidebar__overlay"></div>

    <aside class="sidebar">
      <div class="sidebar__header">
        <a href="../../index.html" class="sidebar__logo">
          <img src="../../favicon.png" alt="FeedNow">
          <span class="sidebar__logo-text">Feed<span>Now</span></span>
        </a>
      </div>
      <nav class="sidebar__nav">
        <div class="sidebar__section-label">Donor Menu</div>
        <a href="dashboard.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-chart-bar"></i></span> Dashboard</a>
        <a href="nearby-ngos.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-map-pin"></i></span> Find NGOs</a>
        <a href="donations.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-package"></i></span> My Donations</a>
        <a href="notifications.html" class="sidebar__link active"><span class="sidebar__link-icon"><i class="ph ph-bell"></i></span> Notifications <span class="sidebar__link-badge">2</span></a>
        <a href="profile.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-user"></i></span> Profile</a>
      </nav>
    
      <div class="sidebar__footer">
        <a href="../../index.html" class="sidebar__footer-link">
          <span class="sidebar__link-icon"><i class="ph ph-house"></i></span> Back to Home
        </a>
        <a href="#" class="sidebar__footer-link sidebar__footer-link--danger" onclick="logout()">
          <span class="sidebar__link-icon"><i class="ph ph-sign-out"></i></span> Logout
        </a>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-main__header" style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: var(--space-4); max-width: 900px; margin-inline: auto; width: 100%;">
        <div>
          <h1 class="dashboard-main__title">Notifications</h1>
          <p class="dashboard-main__subtitle">Stay updated on your donations and account activity.</p>
        </div>
        <button class="btn btn--secondary btn--sm" id="markAllBtn" style="background: white;" onclick="handleMarkAllRead()">Mark all as read</button>
      </header>

      <div class="dashboard-main__content" style="max-width: 900px; margin-inline: auto; width: 100%;">
        <div class="notification-list animate-fade-in-up" id="notificationsList">
          <div style="padding: var(--space-8); text-align: center; color: var(--text-muted);">
            <span class="spinner"></span> Loading notifications...
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/zoom-fix.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/shared/guards.js"></script>
  <script src="../../assets/js/shared/ui.js"></script>
  <script src="../../assets/js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Guards.requireRole('donor')) return;
      loadNotifications();
    });

    async function loadNotifications() {
      const container = document.getElementById('notificationsList');

      try {
        const res = await API.notifications.getMy();
        const notifs = res && res.notifications ? res.notifications : [];

        if (notifs.length === 0) {
          container.innerHTML = `
            <div style="padding: var(--space-12); text-align: center; color: var(--text-muted);">
              <i class="ph ph-bell-slash" style="font-size: 3rem; margin-bottom: var(--space-2); display: block; opacity: 0.5;"></i>
              <h3>No Notifications Yet</h3>
              <p>You will receive updates here when NGOs interact with your donations.</p>
            </div>
          `;
          return;
        }

        const iconConfig = {
          DONATION_CREATED: { icon: 'ph-plus-circle', bg: 'var(--info-bg)', color: 'var(--info)' },
          DONATION_ACCEPTED: { icon: 'ph-check-circle', bg: 'var(--success-bg)', color: 'var(--success)' },
          DONATION_DECLINED: { icon: 'ph-x-circle', bg: '#fee2e2', color: '#991b1b' },
          DONATION_COORDINATED: { icon: 'ph-truck', bg: 'var(--info-bg)', color: 'var(--info)' },
          DONATION_COMPLETED: { icon: 'ph-check-circle', bg: 'var(--success-bg)', color: 'var(--success)' },
        };

        container.innerHTML = notifs.map(n => {
          const cfg = iconConfig[n.type] || { icon: 'ph-bell', bg: 'var(--primary-50)', color: 'var(--primary)' };
          const unreadClass = n.read ? '' : 'unread';
          const timeAgo = UI.timeAgo(n.createdAt);
          const clickAction = n.donationId ? `onclick="handleClickNotif('${n._id}', '${n.donationId}')"` : `onclick="handleMarkRead('${n._id}')"`;

          return `
            <div class="notification-item ${unreadClass}" style="cursor: pointer;" ${clickAction}>
              <div class="notification-icon" style="background: ${cfg.bg}; color: ${cfg.color};">
                <i class="ph ${cfg.icon}"></i>
              </div>
              <div class="notification-content">
                <div class="notification-header">
                  <div class="notification-title">${n.type.replace(/_/g, ' ')}</div>
                  <div class="notification-time">${timeAgo}</div>
                </div>
                <div class="notification-desc">${n.message}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load notifications:', err);
        container.innerHTML = `<div style="color: var(--danger); text-align: center;">Failed to load notifications: ${err.message}</div>`;
      }
    }

    async function handleClickNotif(notifId, donationId) {
      try {
        await API.notifications.markOneRead(notifId);
      } catch (e) {}
      window.location.href = `donation-details.html?id=${donationId}`;
    }

    async function handleMarkRead(notifId) {
      try {
        await API.notifications.markOneRead(notifId);
        loadNotifications();
      } catch (e) {}
    }

    async function handleMarkAllRead() {
      try {
        await API.notifications.markAllRead();
        loadNotifications();
      } catch (err) {
        console.error(err);
      }
    }

    function logout() {
      API.auth.logout();
    }
  </script>
</body>
</html>
