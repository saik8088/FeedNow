<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGO Profile — FeedNow</title>
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar">
      <div class="sidebar__header"><a href="../../index.html" class="sidebar__logo"><img src="../../favicon.png" alt="FeedNow"><span class="sidebar__logo-text">Feed<span>Now</span></span></a></div>
      <nav class="sidebar__nav">
        <div class="sidebar__section-label">NGO Menu</div>
        <a href="dashboard.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-chart-bar"></i></span> Dashboard</a>
        <a href="requests.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-tray-arrow-down"></i></span> Donation Requests</a>
        <a href="notifications.html" class="sidebar__link"><span class="sidebar__link-icon"><i class="ph ph-bell"></i></span> Notifications</a>
        <a href="profile.html" class="sidebar__link active"><span class="sidebar__link-icon"><i class="ph ph-buildings"></i></span> NGO Profile</a>
      </nav>
    
      <div class="sidebar__footer">
        <a href="../../index.html" class="sidebar__footer-link">
          <span class="sidebar__link-icon"><i class="ph ph-house"></i></span> Back to Home
        </a>
        <a href="#" class="sidebar__footer-link sidebar__footer-link--danger" onclick="logout()">
          <span class="sidebar__link-icon"><i class="ph ph-sign-out"></i></span> Logout
        </a>
      </div>
    </aside>

    <main class="dashboard-main">
      <header class="dashboard-main__header" style="max-width: 600px; margin-inline: auto; width: 100%;">
        <h1 class="dashboard-main__title">NGO Profile Settings</h1>
      </header>
      <div class="dashboard-main__content" style="max-width: 600px; margin-inline: auto; width: 100%;">
        <div class="card animate-fade-in-up">
          <form onsubmit="return false;">
            <div class="form-group">
              <label class="form-label">NGO Name</label>
              <input type="text" class="form-input" value="Hope Foundation">
            </div>
            <div class="form-group">
              <label class="form-label">Public Description</label>
              <textarea class="form-textarea">Dedicated to providing daily nutritious meals to underprivileged children and shelters in the local area.</textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Operating Address</label>
              <input type="text" class="form-input" value="123 Charity Lane, Koramangala, Bengaluru 560034">
            </div>
            <hr class="divider">
            <h3 class="margin-bottom-4">Donation Preferences</h3>
            <div class="form-group">
              <label class="form-label">Accepted Food Types</label>
              <div class="form-checkbox-group">
                <label class="form-checkbox"><input type="checkbox" checked> <span class="form-checkbox__label">Cooked Meals</span></label>
                <label class="form-checkbox"><input type="checkbox" checked> <span class="form-checkbox__label">Raw Rations</span></label>
                <label class="form-checkbox"><input type="checkbox" checked> <span class="form-checkbox__label">Fresh Fruits/Veg</span></label>
              </div>
            </div>
            <button class="btn btn--primary margin-top-4" onclick="alert('Profile updated (Mock)')">Save Changes</button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="../../assets/js/navigation.js"></script>
</body>
</html>
