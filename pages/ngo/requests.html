<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Requests — FeedNow</title>
  <meta name="description" content="View and manage incoming food donation requests.">
  <link rel="icon" type="image/png" href="../../favicon.png">
  <link rel="stylesheet" href="../../assets/css/variables.css">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/global.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
  <style>
    .request-card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-xl);
      padding: var(--space-5);
      margin-bottom: var(--space-4);
      transition: var(--transition-all);
    }
    .request-card:hover {
      box-shadow: var(--shadow-sm);
      border-color: var(--primary-200);
    }
    .request-card__header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--space-4);
    }
    .request-card__donor {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .request-card__donor-info h4 {
      font-size: var(--text-base);
      font-weight: var(--weight-semibold);
      color: var(--text-primary);
    }
    .request-card__donor-info p {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }
    .request-card__food {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: var(--space-4);
      padding: var(--space-4);
      background: var(--gray-50);
      border-radius: var(--radius-lg);
      margin-bottom: var(--space-4);
    }
    .request-card__food-item {
      display: flex;
      flex-direction: column;
    }
    .request-card__food-label {
      font-size: var(--text-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .request-card__food-val {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--text-primary);
    }
    .request-card__actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: var(--space-3);
      padding-top: var(--space-4);
      border-top: 1px solid var(--border-light);
    }

    @media (max-width: 768px) {
      .request-card__header {
        flex-direction: column;
        gap: var(--space-3);
      }
      .request-card__actions {
        flex-direction: column;
        width: 100%;
      }
      .request-card__actions .btn {
        width: 100%;
      }
    }
  </style>

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <div class="dashboard-layout">
    
    <button class="sidebar__mobile-toggle" aria-label="Toggle Menu">☰</button>
    <div class="sidebar__overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar__header">
        <a href="../../index.html" class="sidebar__logo">
          <img src="../../favicon.png" alt="FeedNow">
          <span class="sidebar__logo-text">Feed<span>Now</span></span>
        </a>
      </div>

      <nav class="sidebar__nav">
        <div class="sidebar__section-label">NGO Menu</div>
        <a href="dashboard.html" class="sidebar__link">
          <span class="sidebar__link-icon"><i class="ph ph-chart-bar"></i></span> Dashboard
        </a>
        <a href="requests.html" class="sidebar__link active">
          <span class="sidebar__link-icon"><i class="ph ph-tray-arrow-down"></i></span> Donation Requests
          <span class="sidebar__link-badge">3</span>
        </a>
        <a href="notifications.html" class="sidebar__link">
          <span class="sidebar__link-icon"><i class="ph ph-bell"></i></span> Notifications
        </a>
        <a href="profile.html" class="sidebar__link">
          <span class="sidebar__link-icon"><i class="ph ph-buildings"></i></span> NGO Profile
        </a>
      </nav>
    
      <div class="sidebar__footer">
        <a href="../../index.html" class="sidebar__footer-link">
          <span class="sidebar__link-icon"><i class="ph ph-house"></i></span> Back to Home
        </a>
        <a href="#" class="sidebar__footer-link sidebar__footer-link--danger" onclick="logout()">
          <span class="sidebar__link-icon"><i class="ph ph-sign-out"></i></span> Logout
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
      <header class="dashboard-main__header">
        <div>
          <h1 class="dashboard-main__title">Donation Requests</h1>
          <p class="dashboard-main__subtitle">Review and manage food offers from nearby donors.</p>
        </div>
      </header>

      <div class="dashboard-main__content">
        
        <div class="tabs animate-fade-in-up" id="requestTabs">
          <div class="tab active" data-tab="tab-new">New <span class="tab__count" id="newCount">0</span></div>
          <div class="tab" data-tab="tab-accepted">Accepted</div>
          <div class="tab" data-tab="tab-completed">Completed</div>
          <div class="tab" data-tab="tab-declined">Declined</div>
        </div>

        <div class="content-grid animate-fade-in-up delay-1">
          
          <!-- NEW TAB -->
          <div id="tab-new" class="tab-pane" style="display: block;">
            <div style="padding: var(--space-8); text-align: center; color: var(--text-muted);">
              <span class="spinner"></span> Loading requests...
            </div>
          </div>

          <!-- ACCEPTED TAB -->
          <div id="tab-accepted" class="tab-pane" style="display: none;">
            <div style="padding: var(--space-8); text-align: center; color: var(--text-muted);">
              <span class="spinner"></span> Loading requests...
            </div>
          </div>

          <!-- COMPLETED TAB -->
          <div id="tab-completed" class="tab-pane" style="display: none;">
            <div style="padding: var(--space-8); text-align: center; color: var(--text-muted);">
              <span class="spinner"></span> Loading requests...
            </div>
          </div>

          <!-- DECLINED TAB -->
          <div id="tab-declined" class="tab-pane" style="display: none;">
            <div style="padding: var(--space-8); text-align: center; color: var(--text-muted);">
              <span class="spinner"></span> Loading requests...
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../../assets/js/zoom-fix.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/shared/guards.js"></script>
  <script src="../../assets/js/navigation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Guards.requireRole('ngo')) return;

      setupTabs();

      try {
        const res = await API.donations.getReceived();
        const donations = res && res.donations ? res.donations : [];

        const newDonations = donations.filter(d => d.status === 'PENDING');
        const acceptedDonations = donations.filter(d => ['ACCEPTED', 'COORDINATED'].includes(d.status));
        const completedDonations = donations.filter(d => d.status === 'COMPLETED');
        const declinedDonations = donations.filter(d => d.status === 'DECLINED');

        document.getElementById('newCount').textContent = newDonations.length;

        renderPane('tab-new', newDonations, 'new');
        renderPane('tab-accepted', acceptedDonations, 'accepted');
        renderPane('tab-completed', completedDonations, 'completed');
        renderPane('tab-declined', declinedDonations, 'declined');

      } catch (err) {
        console.error('Failed to load NGO requests:', err);
        document.getElementById('tab-new').innerHTML = `<div style="color: var(--danger); text-align: center;">Failed to load requests: ${err.message}</div>`;
      }
    });

    function renderPane(paneId, list, type) {
      const pane = document.getElementById(paneId);
      if (!pane) return;

      if (list.length === 0) {
        const emptyConfig = {
          new: { icon: 'ph-tray', title: 'No New Requests', desc: 'No pending food donations at the moment.' },
          accepted: { icon: 'ph-handshake', title: 'No Accepted Requests', desc: 'When you accept a donation, it will appear here for pickup coordination.' },
          completed: { icon: 'ph-package', title: 'No Completed Requests', desc: 'Successfully picked up donations will be logged here.' },
          declined: { icon: 'ph-x-circle', title: 'No Declined Requests', desc: 'Requests you decline will appear here for your records.' },
        };
        const cfg = emptyConfig[type] || emptyConfig.new;
        pane.innerHTML = `
          <div style="padding: var(--space-10) 0; text-align: center;">
            <i class="ph ${cfg.icon}" style="font-size: 3rem; color: var(--text-muted); margin-bottom: var(--space-4);"></i>
            <h3 style="font-size: var(--text-lg); font-weight: var(--weight-bold); margin-bottom: var(--space-2);">${cfg.title}</h3>
            <p style="color: var(--text-secondary);">${cfg.desc}</p>
          </div>
        `;
        return;
      }

      pane.innerHTML = list.map(d => {
        const donorName = d.donorId?.name || 'Anonymous Donor';
        const donorPhone = d.donorId?.phone || '';
        const initials = donorName.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        const deadlineStr = d.pickupDeadline ? new Date(d.pickupDeadline).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' }) : 'Flexible';
        
        let actionsHtml = '';
        if (d.status === 'PENDING') {
          actionsHtml = `
            <div class="request-card__actions">
              <a href="request-details.html?id=${d._id}" class="btn btn--danger">Decline</a>
              <a href="request-details.html?id=${d._id}" class="btn btn--primary">Review & Accept</a>
            </div>
          `;
        } else if (d.status === 'ACCEPTED' || d.status === 'COORDINATED') {
          actionsHtml = `
            <div class="request-card__actions">
              <a href="request-details.html?id=${d._id}" class="btn btn--secondary">Manage Pickup</a>
              <a href="request-details.html?id=${d._id}" class="btn btn--primary">View Details</a>
            </div>
          `;
        } else {
          actionsHtml = `
            <div class="request-card__actions">
              <a href="request-details.html?id=${d._id}" class="btn btn--ghost">View Summary</a>
            </div>
          `;
        }

        return `
          <div class="request-card">
            <div class="request-card__header">
              <div class="request-card__donor">
                <div class="avatar avatar--md">${initials}</div>
                <div class="request-card__donor-info">
                  <h4>${donorName}</h4>
                  <p><i class="ph ph-phone"></i> ${donorPhone || 'Donor Contact'}</p>
                </div>
              </div>
              <span class="badge badge--warning">Deadline: ${deadlineStr}</span>
            </div>
            
            <div class="request-card__food">
              <div class="request-card__food-item">
                <span class="request-card__food-label">Food Details</span>
                <span class="request-card__food-val">${d.foodName}</span>
              </div>
              <div class="request-card__food-item">
                <span class="request-card__food-label">Type & Quantity</span>
                <span class="request-card__food-val">${d.foodType} • ${d.quantity}</span>
              </div>
              <div class="request-card__food-item">
                <span class="request-card__food-label">Pickup Location</span>
                <span class="request-card__food-val">${d.pickupAddress || 'Address provided'}</span>
              </div>
            </div>

            ${actionsHtml}
          </div>
        `;
      }).join('');
    }

    function setupTabs() {
      const tabs = document.querySelectorAll('#requestTabs .tab');
      const panes = document.querySelectorAll('.tab-pane');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          panes.forEach(pane => pane.style.display = 'none');
          const targetId = tab.getAttribute('data-tab');
          const target = document.getElementById(targetId);
          if (target) {
            target.style.display = 'block';
            target.classList.add('animate-fade-in-up');
          }
        });
      });
    }

    function logout() {
      API.auth.logout();
    }
  </script>
</body>
</html>
